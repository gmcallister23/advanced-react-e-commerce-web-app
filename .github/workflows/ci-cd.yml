name: Ecommerce App CI/CD

on: 
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      #Step 1: Checkout the code
      - name: Checkout code
        uses: actions/checkout@v4

      #Step 2: Setup Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with: 
          node-version: '20'

      #Step 3: Install dependencies
      - name: Install dependencies
        run: npm install

      #Step 4: Run Tests
      - name: Run tests
        run: npm test

      - name: Debug tsconfig.node.json
        run: |
          echo "---- tsconfig.node.json ----"
          cat tsconfig.node.json
          echo "----------------------------"

      #Step 5: Build React app
      - name: Build React App
        run: npm run build
   
  deploy:

    runs-on: ubuntu-latest
    needs: build

    steps:

      #Step 1
      - name: Checkout Code
        uses: actions/checkout@v4
      
      #Step 2
      - name: Set up Node.js
        uses: actions/setup-node@v4

        with:
          node-version: 20

      #Step 3
      - name: Install dependencies
        run: npm install 
      
      #Step 4
      - name: Deploy to Vercel
        run: |
          npm install -g vercel
          vercel --prod --yes --token ${{secrets.VERCEL_TOKEN}}

      
